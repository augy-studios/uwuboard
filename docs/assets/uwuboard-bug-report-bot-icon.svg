<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000">
  <!-- uwuBoard Bug Reports: the Telegram bot's profile picture. Drawn in the app icon's flat
       style (docs/assets/uwuboard-icon.svg): the same mint ground and dark green board, with
       one card on it, and a bug on the card. Telegram crops profile pictures to a circle, so
       everything sits inside the 400-radius circle the app icon keeps to. -->
  <rect width="1000" height="1000" fill="#ccffcc"/>

  <!-- The board -->
  <rect x="200" y="200" width="600" height="600" rx="110" fill="#1f6b3d"/>

  <!-- Column headers -->
  <g fill="#ffffff" fill-opacity="0.45">
    <rect x="262" y="250" width="96" height="22" rx="11"/>
    <rect x="452" y="250" width="96" height="22" rx="11"/>
    <rect x="642" y="250" width="96" height="22" rx="11"/>
  </g>

  <!-- The card -->
  <rect x="262" y="300" width="476" height="438" rx="48" fill="#ffffff"/>

  <!-- The bug -->
  <g transform="translate(500 524) scale(1.1)">
    <!-- Legs and antennae, under the body -->
    <g fill="none" stroke="#1f6b3d" stroke-width="22" stroke-linecap="round" stroke-linejoin="round">
      <path d="M-60 -40 L-122 -78 L-150 -66"/>
      <path d="M60 -40 L122 -78 L150 -66"/>
      <path d="M-70 26 L-160 26"/>
      <path d="M70 26 L160 26"/>
      <path d="M-60 92 L-118 132 L-130 168"/>
      <path d="M60 92 L118 132 L130 168"/>
      <path d="M-18 -128 Q-40 -170 -78 -180"/>
      <path d="M18 -128 Q40 -170 78 -180"/>
    </g>
    <g fill="#1f6b3d">
      <circle cx="-82" cy="-181" r="16"/>
      <circle cx="82" cy="-181" r="16"/>
      <!-- Head -->
      <circle cx="0" cy="-104" r="50"/>
    </g>

    <!-- Body: a red shell, split down the middle, with spots -->
    <ellipse cx="0" cy="34" rx="104" ry="126" fill="#e5484d"/>
    <path d="M0 -84 V156" stroke="#1f6b3d" stroke-width="14" stroke-linecap="round"/>
    <g fill="#1f6b3d">
      <circle cx="-50" cy="-6" r="20"/>
      <circle cx="50" cy="-6" r="20"/>
      <circle cx="-48" cy="78" r="17"/>
      <circle cx="48" cy="78" r="17"/>
    </g>
  </g>
</svg>
