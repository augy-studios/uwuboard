<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000">
  <!-- uwuBoard app icon. Flat: solid fills, no gradients, shadows or sparkles.
       A kanban board (Trello's rounded board of cards, Jira's To Do / In Progress / Done
       columns) centred on the canvas. The board's farthest corner is 379 from the centre,
       inside the 400-radius circle a round or maskable crop keeps. -->
  <rect width="1000" height="1000" fill="#ccffcc"/>

  <!-- The board -->
  <rect x="200" y="200" width="600" height="600" rx="110" fill="#1f6b3d"/>

  <!-- The cards, moved down so they sit in the middle of the board. -->
  <g transform="translate(0 24)">
    <!-- Column headers -->
    <g fill="#ffffff" fill-opacity="0.45">
      <rect x="262" y="262" width="96" height="22" rx="11"/>
      <rect x="432" y="262" width="96" height="22" rx="11"/>
      <rect x="602" y="262" width="96" height="22" rx="11"/>
    </g>

    <!-- To Do: three cards, blue labels -->
    <g>
      <rect x="262" y="314" width="136" height="112" rx="24" fill="#ffffff"/>
      <rect x="284" y="336" width="58" height="20" rx="10" fill="#4c9aff"/>
      <rect x="284" y="374" width="88" height="14" rx="7" fill="#d4e3da"/>

      <rect x="262" y="446" width="136" height="112" rx="24" fill="#ffffff"/>
      <rect x="284" y="468" width="58" height="20" rx="10" fill="#4c9aff"/>
      <rect x="284" y="506" width="70" height="14" rx="7" fill="#d4e3da"/>

      <rect x="262" y="578" width="136" height="112" rx="24" fill="#ffffff"/>
      <rect x="284" y="600" width="58" height="20" rx="10" fill="#4c9aff"/>
      <rect x="284" y="638" width="88" height="14" rx="7" fill="#d4e3da"/>
    </g>

    <!-- In Progress: two cards, amber labels -->
    <g>
      <rect x="432" y="314" width="136" height="112" rx="24" fill="#ffffff"/>
      <rect x="454" y="336" width="58" height="20" rx="10" fill="#ffb31f"/>
      <rect x="454" y="374" width="80" height="14" rx="7" fill="#d4e3da"/>

      <rect x="432" y="446" width="136" height="112" rx="24" fill="#ffffff"/>
      <rect x="454" y="468" width="58" height="20" rx="10" fill="#ffb31f"/>
      <rect x="454" y="506" width="88" height="14" rx="7" fill="#d4e3da"/>
    </g>

    <!-- Done: one card, done green with a tick -->
    <g>
      <rect x="602" y="314" width="136" height="112" rx="24" fill="#5ee08f"/>
      <path d="M637 372 l22 22 l44 -44" fill="none" stroke="#1f6b3d" stroke-width="20" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </g>
</svg>
